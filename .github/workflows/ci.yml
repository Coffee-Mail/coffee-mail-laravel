name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: Configure VCS repository for SDK PHP
        run: |
          composer config repositories.sdk-php vcs https://github.com/Coffee-Mail/coffee-mail-sdk-php.git

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Code standards (phpcs)
        run: composer lint

      - name: Static analysis (phpstan)
        run: composer analyse

      - name: Tests (pest)
        run: composer test
